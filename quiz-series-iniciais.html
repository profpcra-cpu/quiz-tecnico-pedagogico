<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Infantil - Descoberta Mágica</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0b1020;
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-color: #f8fafc;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --accent: #ec4899;
            --success: #22c55e;
            --error: #ef4444;
            --gold: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 20% 0%, #1e1b4b 0%, #0b1020 60%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 16px;
            overflow-x: hidden;
        }
        body::before, body::after {
            content: ""; position: fixed; border-radius: 50%;
            filter: blur(120px); opacity: 0.3; z-index: -1;
            pointer-events: none;
        }
        body::before { width: 400px; height: 400px; background: #6366f1; top: -100px; left: -100px; }
        body::after { width: 400px; height: 400px; background: #ec4899; bottom: -100px; right: -100px; }

        .quiz-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            padding: 24px;
            width: 100%; max-width: 550px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
            text-align: center;
            animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .timer-bar {
            width: 100%; height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 99px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .timer-fill {
            height: 100%; width: 100%;
            background: var(--gold);
            border-radius: 99px;
            transition: width 0.1s linear;
        }

        .progress-container {
            width: 100%; height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 99px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 99px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .top-bar-info {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; font-size: 13px; font-weight: 800;
        }
        .best-display {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 4px 10px; border-radius: 99px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        .score-display {
            background: rgba(251, 191, 36, 0.15);
            color: var(--gold);
            padding: 4px 10px; border-radius: 99px;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .progress-bar-text {
            font-size: 13px; font-weight: 800;
            color: var(--accent);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-header {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin: 20px 0 16px;
        }
        .question-box {
            font-size: 19px; font-weight: 700;
            line-height: 1.4;
            flex: 1;
        }
        .btn-falar {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px; color: #fff;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .btn-falar:hover { background: rgba(99, 102, 241, 0.3); }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .card-opcao {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 16px 12px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            position: relative;
            overflow: hidden;
            user-select: none;
            font-family: inherit;
            color: inherit;
            text-align: center;
            width: 100%;
        }
        .card-opcao:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
        }
        .card-opcao:hover:not(.disabled) {
            transform: translateY(-5px) scale(1.02);
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.15);
            box-shadow: 0 10px 25px -5px var(--primary-glow);
        }
        .card-opcao.disabled {
            cursor: not-allowed;
            pointer-events: none;
        }
        .card-icone {
            font-size: 45px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }
        .card-opcao:hover:not(.disabled) .card-icone { transform: scale(1.15); }
        .card-opcao span {
            font-size: 14px; font-weight: 600;
            line-height: 1.2;
        }

        .card-opcao.correto {
            background: rgba(34, 197, 94, 0.25) !important;
            border-color: var(--success) !important;
            animation: acertoPulse 0.5s ease;
        }
        .card-opcao.incorreto {
            background: rgba(239, 68, 68, 0.25) !important;
            border-color: var(--error) !important;
            animation: erroShake 0.4s ease;
        }
        @keyframes acertoPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px var(--success); }
            100% { transform: scale(1); }
        }
        @keyframes erroShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .feedback-badge {
            position: absolute;
            top: 8px; right: 8px;
            background: var(--success);
            color: #fff;
            font-size: 12px; font-weight: 800;
            padding: 3px 8px;
            border-radius: 99px;
            animation: cardIn 0.3s ease;
        }

        .final-screen {
            display: flex; flex-direction: column; align-items: center; gap: 16px;
            animation: cardIn 0.6s ease;
        }
        .medalha {
            font-size: 80px;
            animation: flutuar 2s infinite ease-in-out;
            filter: drop-shadow(0 0 20px var(--gold));
        }
        @keyframes flutuar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .final-screen h2 {
            font-size: 26px; font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .final-screen p {
            font-size: 15px; color: #cbd5e1; line-height: 1.5;
        }
        .pontuacao-final {
            font-size: 32px; font-weight: 800;
            color: var(--gold);
            margin: 8px 0;
        }
        .btn-reiniciar {
            margin-top: 12px;
            padding: 14px 28px;
            border: none; border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff; font-weight: 800; font-size: 15px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px var(--primary-glow);
            transition: transform 0.2s ease;
            font-family: inherit;
        }
        .btn-reiniciar:hover { transform: scale(1.05); }
        .btn-reiniciar:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }

        @media (max-width: 400px) {
            .cards-grid { grid-template-columns: 1fr; }
            .question-box { font-size: 17px; }
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-container">
        <div class="top-bar-info">
            <div class="best-display" id="best-display">🏅 Melhor: 0</div>
            <div class="score-display" id="score-display">⭐ 0 pts</div>
        </div>
        <div class="timer-bar">
            <div class="timer-fill" id="timer-fill"></div>
        </div>
        <div class="progress-container">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-bar-text" id="bloco-indicador">Bloco 1 de 10</div>
        
        <div class="question-header">
            <div class="question-box" id="pergunta-texto">Carregando pergunta...</div>
            <button class="btn-falar" id="btn-falar" title="Ouvir pergunta" aria-label="Ouvir pergunta">🔊</button>
        </div>

        <div class="cards-grid" id="grid-cards" role="group" aria-label="Opções de resposta"></div>
    </div>

    <script>
        'use strict';

        const blocosQuiz = [
            {
                bloco: 1,
                pergunta: "Qual destes animais é o Rei da Selva?",
                opcoes: [
                    { texto: "Leão",     icone: "🦁", correto: true },
                    { texto: "Elefante", icone: "🐘", correto: false },
                    { texto: "Girafa",   icone: "🦒", correto: false },
                    { texto: "Zebra",    icone: "🦓", correto: false }
                ]
            },
            {
                bloco: 2,
                pergunta: "Qual é a cor do céu num dia de sol?",
                opcoes: [
                    { texto: "Azul",     icone: "🌤️", correto: true },
                    { texto: "Verde",    icone: "🌲", correto: false },
                    { texto: "Vermelho", icone: "🍎", correto: false },
                    { texto: "Roxo",     icone: "🍇", correto: false }
                ]
            },
            {
                bloco: 3,
                pergunta: "Qual destas frutas é vermelha e crocante?",
                opcoes: [
                    { texto: "Maçã",    icone: "🍎", correto: true },
                    { texto: "Banana",  icone: "🍌", correto: false },
                    { texto: "Laranja", icone: "🍊", correto: false },
                    { texto: "Uva",     icone: "🍇", correto: false }
                ]
            },
            {
                bloco: 4,
                pergunta: "Quantos planetas existem no Sistema Solar?",
                opcoes: [
                    { texto: "8 Planetas",  icone: "🪐", correto: true },
                    { texto: "5 Planetas",  icone: "🌍", correto: false },
                    { texto: "12 Planetas", icone: "✨", correto: false },
                    { texto: "3 Planetas",  icone: "⭐", correto: false }
                ]
            },
            {
                bloco: 5,
                pergunta: "Qual destes é um meio de transporte?",
                opcoes: [
                    { texto: "Carro",   icone: "🚗", correto: true },
                    { texto: "Árvore",  icone: "🌳", correto: false },
                    { texto: "Cadeira", icone: "🪑", correto: false },
                    { texto: "Nuvem",   icone: "☁️", correto: false }
                ]
            },
            {
                bloco: 6,
                pergunta: "Qual é o maior animal do mundo?",
                opcoes: [
                    { texto: "Baleia Azul", icone: "🐋", correto: true },
                    { texto: "Elefante",    icone: "🐘", correto: false },
                    { texto: "Tubarão",     icone: "🦈", correto: false },
                    { texto: "Girafa",      icone: "🦒", correto: false }
                ]
            },
            {
                bloco: 7,
                pergunta: "Em que estação do ano costuma nevar?",
                opcoes: [
                    { texto: "Inverno",   icone: "❄️", correto: true },
                    { texto: "Verão",     icone: "☀️", correto: false },
                    { texto: "Outono",    icone: "🍂", correto: false },
                    { texto: "Primavera", icone: "🌷", correto: false }
                ]
            },
            {
                bloco: 8,
                pergunta: "Qual destes é um inseto?",
                opcoes: [
                    { texto: "Borboleta", icone: "🦋", correto: true },
                    { texto: "Pássaro",   icone: "🐦", correto: false },
                    { texto: "Peixe",     icone: "🐟", correto: false },
                    { texto: "Cobra",     icone: "🐍", correto: false }
                ]
            },
            {
                bloco: 9,
                pergunta: "Que forma geométrica tem 3 lados?",
                opcoes: [
                    { texto: "Triângulo", icone: "🔺", correto: true },
                    { texto: "Quadrado",  icone: "⬛", correto: false },
                    { texto: "Círculo",   icone: "⭕", correto: false },
                    { texto: "Retângulo", icone: "🟩", correto: false }
                ]
            },
            {
                bloco: 10,
                pergunta: "Qual é o satélite natural da Terra?",
                opcoes: [
                    { texto: "Lua",     icone: "🌙", correto: true },
                    { texto: "Sol",     icone: "☀️", correto: false },
                    { texto: "Marte",   icone: "🔴", correto: false },
                    { texto: "Júpiter", icone: "🪐", correto: false }
                ]
            }
        ];

        let indiceAtual = 0;
        let pontuacao = 0;
        let melhorPontuacao = parseInt(localStorage.getItem('quiz_infantil_best') || '0', 10);
        let bloqueado = false;
        let tempoRestante = 15;
        let timerInterval = null;

        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function tocarSom(tipo) {
            const ctx = getAudioCtx();
            if (!ctx) return;
            let notas = [];
            if (tipo === 'acerto')  notas = [523.25, 659.25, 783.99];
            else if (tipo === 'erro')   notas = [311.13, 233.08];
            else if (tipo === 'vitoria') notas = [523.25, 659.25, 783.99, 1046.50];

            const inicio = ctx.currentTime;
            notas.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                const t0 = inicio + i * 0.12;
                const t1 = t0 + 0.18;
                gain.gain.setValueAtTime(0, t0);
                gain.gain.linearRampToValueAtTime(0.18, t0 + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, t1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t0);
                osc.stop(t1 + 0.02);
            });
        }

        function falarTexto(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'pt-BR';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function embaralhar(array) {
            const copia = array.slice();
            for (let i = copia.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copia[i], copia[j]] = [copia[j], copia[i]];
            }
            return copia;
        }

        function iniciarTimer() {
            clearInterval(timerInterval);
            tempoRestante = 15;
            const timerFill = document.getElementById('timer-fill');
            
            timerInterval = setInterval(() => {
                tempoRestante -= 0.1;
                const porcentagem = (tempoRestante / 15) * 100;
                if (timerFill) timerFill.style.width = `${Math.max(porcentagem, 0)}%`;

                if (tempoRestante <= 0) {
                    clearInterval(timerInterval);
                    tempoEsgotado();
                }
            }, 100);
        }

        function tempoEsgotado() {
            if (bloqueado) return;
            bloqueado = true;
            tocarSom('erro');
            const cards = document.querySelectorAll('.card-opcao');
            cards.forEach(c => c.classList.add('disabled'));

            setTimeout(() => {
                indiceAtual++;
                if (indiceAtual < blocosQuiz.length) {
                    carregarPergunta();
                } else {
                    mostrarTelaFinal();
                }
            }, 1500);
        }

        function carregarPergunta() {
            bloqueado = false;
            clearInterval(timerInterval);
            
            const atual = blocosQuiz[indiceAtual];
            const total = blocosQuiz.length;

            document.getElementById('bloco-indicador').textContent = `Bloco ${atual.bloco} de ${total}`;
            document.getElementById('pergunta-texto').textContent = atual.pergunta;
            document.getElementById('score-display').textContent = `⭐ ${pontuacao} pts`;
            document.getElementById('best-display').textContent = `🏅 Melhor: ${melhorPontuacao}`;

            const progresso = (indiceAtual / total) * 100;
            document.getElementById('progress-fill').style.width = `${progresso}%`;

            const grid = document.getElementById('grid-cards');
            grid.innerHTML = '';

            const opcoesEmbaralhadas = embaralhar(atual.opcoes);

            opcoesEmbaralhadas.forEach(opcao => {
                const card = document.createElement('button');
                card.type = 'button';
                card.className = 'card-opcao';
                card.setAttribute('aria-label', `Resposta: ${opcao.texto}`);

                const iconeDiv = document.createElement('div');
                iconeDiv.className = 'card-icone';
                iconeDiv.textContent = opcao.icone;
                card.appendChild(iconeDiv);

                const span = document.createElement('span');
                span.textContent = opcao.texto;
                card.appendChild(span);

                card.addEventListener('click', () => selecionarResposta(opcao, card));
                grid.appendChild(card);
            });

            document.getElementById('btn-falar').onclick = () => falarTexto(atual.pergunta);

            iniciarTimer();
        }

        function selecionarResposta(opcao, cardElement) {
            if (bloqueado) return;
            bloqueado = true;
            clearInterval(timerInterval);

            const cards = document.querySelectorAll('.card-opcao');
            cards.forEach(c => c.classList.add('disabled'));

            if (opcao.correto) {
                cardElement.classList.add('correto');

                const badge = document.createElement('span');
                badge.className = 'feedback-badge';
                badge.textContent = '✓';
                cardElement.appendChild(badge);

                tocarSom('acerto');
                
                const bonusVelocidade = Math.floor(tempoRestante);
                pontuacao += 10 + bonusVelocidade;
                document.getElementById('score-display').textContent = `⭐ ${pontuacao} pts`;

                const total = blocosQuiz.length;
                const progresso = ((indiceAtual + 1) / total) * 100;
                document.getElementById('progress-fill').style.width = `${progresso}%`;

                setTimeout(() => {
                    indiceAtual++;
                    if (indiceAtual < blocosQuiz.length) {
                        carregarPergunta();
                    } else {
                        mostrarTelaFinal();
                    }
                }, 1400);
            } else {
                cardElement.classList.add('incorreto');
                tocarSom('erro');

                setTimeout(() => {
                    cardElement.classList.remove('incorreto');
                    cards.forEach(c => c.classList.remove('disabled'));
                    bloqueado = false;
                    iniciarTimer();
                }, 900);
            }
        }

        function mostrarTelaFinal() {
            clearInterval(timerInterval);
            const total = blocosQuiz.length;
            const percentual = (pontuacao / (total * 10)) * 100;

            if (pontuacao > melhorPontuacao) {
                melhorPontuacao = pontuacao;
                localStorage.setItem('quiz_infantil_best', String(melhorPontuacao));
            }

            let medalha, titulo, mensagem;
            if (percentual >= 90) {
                medalha = "🏆"; titulo = "Mestre Supremo!";
                mensagem = "Uau! Você é um verdadeiro gênio! Acertou quase tudo!";
            } else if (percentual >= 70) {
                medalha = "🥇"; titulo = "Explorador do Saber!";
                mensagem = "Excelente trabalho! Você tem um conhecimento incrível!";
            } else if (percentual >= 50) {
                medalha = "🥈"; titulo = "Aprendiz Curioso!";
                mensagem = "Muito bem! Continue a explorar e aprender cada vez mais!";
            } else {
                medalha = "🥉"; titulo = "Pequeno Aventureiro!";
                mensagem = "Bom esforço! Tente novamente para ganhar mais estrelas!";
            }

            tocarSom('vitoria');

            if (typeof confetti === 'function') {
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            }

            const container = document.getElementById('quiz-container');
            container.innerHTML = `
                <div class="final-screen">
                    <div class="medalha">${medalha}</div>
                    <h2>${titulo}</h2>
                    <div class="pontuacao-final">${pontuacao} pontos</div>
                    <p>${mensagem}</p>
                    <p style="font-size:13px;color:#94a3b8;">🏅 Melhor pontuação: ${melhorPontuacao} pts</p>
                    <button class="btn-reiniciar" id="btn-reiniciar">🔄 Jogar Novamente</button>
                </div>
            `;
            document.getElementById('btn-reiniciar').addEventListener('click', reiniciarQuiz);
        }

        function reiniciarQuiz() {
            indiceAtual = 0;
            pontuacao = 0;
            bloqueado = false;

            const container = document.getElementById('quiz-container');
            container.innerHTML = `
                <div class="top-bar-info">
                    <div class="best-display" id="best-display">🏅 Melhor: ${melhorPontuacao}</div>
                    <div class="score-display" id="score-display">⭐ 0 pts</div>
                </div>
                <div class="timer-bar">
                    <div class="timer-fill" id="timer-fill"></div>
                </div>
                <div class="progress-container">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="progress-bar-text" id="bloco-indicador">Bloco 1 de ${blocosQuiz.length}</div>
                <div class="question-header">
                    <div class="question-box" id="pergunta-texto">Carregando pergunta...</div>
                    <button class="btn-falar" id="btn-falar" title="Ouvir pergunta" aria-label="Ouvir pergunta">🔊</button>
                </div>
                <div class="cards-grid" id="grid-cards" role="group" aria-label="Opções de resposta"></div>
            `;
            carregarPergunta();
        }

        carregarPergunta();
    </script>
</body>
</html>
