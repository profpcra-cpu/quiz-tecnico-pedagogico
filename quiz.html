<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Técnico-Pedagógico | Brain Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1020;
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(148, 163, 184, 0.15);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --btn-primary: #6366f1;
            --btn-hover: #818cf8;
            --input-bg: rgba(15, 23, 42, 0.7);
            --radius-lg: 20px;
            --radius-md: 12px;
            --success: #10b981;
            --error: #ef4444;
        }
        [data-theme="light"] {
            --bg-color: #eef2ff;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(15, 23, 42, 0.08);
            --text-color: #0f172a;
            --text-muted: #475569;
            --input-bg: rgba(255, 255, 255, 0.95);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 30px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 20px 60px -20px rgba(0,0,0,0.5);
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-link { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 600; }
        .back-link:hover { color: var(--text-color); }
        .user-badge-display { font-size: 13px; font-weight: 600; color: var(--btn-primary); background: var(--input-bg); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--card-border); }
        
        h1 { font-size: 22px; margin: 0 0 6px 0; }
        p.subtitle { font-size: 13.5px; color: var(--text-muted); margin: 0 0 20px 0; }

        .question-box {
            background: var(--input-bg); border: 1px solid var(--card-border);
            border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px;
        }
        .question-title { font-size: 15px; font-weight: 700; margin-bottom: 15px; }
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--text-color); padding: 12px 16px; border-radius: var(--radius-md);
            text-align: left; font-size: 13.5px; font-family: inherit; cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--btn-primary); background: rgba(99, 102, 241, 0.1); }
        .option-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: #34d399; }
        .option-btn.incorrect { background: rgba(239, 68, 68, 0.2); border-color: var(--error); color: #f87171; }

        .btn-main {
            background: linear-gradient(135deg, var(--btn-primary), #8b5cf6); color: #fff;
            border: none; padding: 12px 20px; border-radius: var(--radius-md); font-weight: 700;
            cursor: pointer; width: 100%; font-size: 14px; margin-top: 10px; display: none;
        }
        .btn-main:hover { opacity: 0.9; }
        .results-box { text-align: center; padding: 20px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-top">
            <a href="index.html" class="back-link">← Voltar ao Hub</a>
            <div id="user-info-badge" class="user-badge-display">Carregando utilizador...</div>
        </div>

        <h1>📝 Quiz Técnico-Pedagógico</h1>
        <p class="subtitle">Avaliação formativa baseada em Perrenoud, Freire e competências profissionais.</p>

        <div id="quiz-container">
            <div class="question-box" id="box-pergunta">
                <div class="question-title" id="texto-pergunta">A carregar pergunta...</div>
                <div class="options-list" id="lista-opcoes"></div>
            </div>
            <button class="btn-main" id="btn-proximo">Seguinte Pergunta</button>
        </div>

        <div id="results-container" class="results-box">
            <h2>🏆 Quiz Concluído!</h2>
            <p id="texto-resultado" style="font-size: 15px; margin: 15px 0;"></p>
            <p style="font-size: 13px; color: var(--text-muted);">O seu resultado, nome e e-mail foram salvos com sucesso no registo institucional.</p>
            <a href="index.html" class="btn-main" style="display:inline-block; text-decoration:none; margin-top:20px;">Retornar ao Brain Hub</a>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Configuração do Firebase (Substitua pelas credenciais do seu projeto)
        const firebaseConfig = {
            databaseURL: "SUA_URL_DO_FIREBASE_AQUI.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Validar Sessão do Hub Central
        const nome = localStorage.getItem('brain_hub_nome');
        const email = localStorage.getItem('brain_hub_email');
        const avatar = localStorage.getItem('brain_hub_avatar') || '💡';

        if (!nome || !email) {
            alert('Por favor, faça o registo com Nome e E-mail no Brain Hub antes de aceder ao quiz.');
            window.location.href = 'index.html';
        } else {
            document.getElementById('user-info-badge.').textContent = `${avatar} ${nome}`;
        }

        // Banco de Questões Pedagógicas
        const questoes = [
            {
                pergunta: "De acordo com Philippe Perrenoud, qual destas competências está diretamente associada à gestão da heterogeneidade em sala de aula?",
                opcoes: [
                    "Aplicar exames padronizados sem considerar o contexto socioeconómico.",
                    "Praticar a pedagogia diferenciada, organizando situações de aprendizagem diversificadas.",
                    "Focar exclusivamente na transmissão vertical de conteúdos programáticos.",
                    "Eliminar a participação dos alunos no planeamento pedagógico."
                ],
                correta: 1
            },
            {
                pergunta: "No contexto da práxis educativa libertadora defendida por Paulo Freire, o diálogo pedagógico fundamenta-se em:",
                opcoes: [
                    "Relações de autoridade vertical em que o educador deposita saberes.",
                    "Uma troca horizontal baseada na reflexão crítica sobre a realidade dos educandos.",
                    "Neutralidade científica desvinculada dos problemas sociais.",
                    "Memorização mecânica de conceitos teóricos abstratos."
                ],
                correta: 1
            },
            {
                pergunta: "No ecossistema de avaliação formativa do CEP-ETP, o eixo estruturante 'Sistematizar' refere-se primariamente a:",
                opcoes: [
                    "Organizar estruturadamente os dados e conceitos construídos durante o percurso prático.",
                    "Executar mecanicamente tarefas sem registo prévio.",
                    "Criticar sem critérios fundamentados as diretrizes institucionais.",
                    "Planejar cronogramas sem alinhamento com a matriz curricular."
                ],
                correta: 0
            }
        ];

        let indiceAtual = 0;
        let pontuacao = 0;
        let respondido = false;

        const textoPergunta = document.getElementById('texto-pergunta');
        const listaOpcoes = document.getElementById('lista-opcoes');
        const btnProximo = document.getElementById('btn-proximo');
        const quizContainer = document.getElementById('quiz-container');
        const resultsContainer = document.getElementById('results-container');
        const textoResultado = document.getElementById('texto-resultado');

        function carregarQuestao() {
            respondido = false;
            btnProximo.style.display = 'none';
            const q = questoes[indiceAtual];
            textoPergunta.textContent = `${indiceAtual + 1}. ${q.pergunta}`;
            listaOpcoes.innerHTML = '';

            q.opcoes.forEach((opcao, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opcao;
                btn.onclick = () => selecionarResposta(index, btn);
                listaOpcoes.appendChild(btn);
            });
        }

        function selecionarResposta(indexSelecionado, botaoElemento) {
            if (respondido) return;
            respondido = true;

            const q = questoes[indiceAtual];
            const botoes = listaOpcoes.getElementsByTagName('button');

            if (indexSelecionado === q.correta) {
                botaoElemento.classList.add('correct');
                pontuacao++;
            } else {
                botaoElemento.classList.add('incorrect');
                botoes[q.correta].classList.add('correct');
            }

            for (let b of botoes) b.disabled = true;
            btnProximo.style.display = 'block';
        }

        btnProximo.onclick = () => {
            indiceAtual++;
            if (indiceAtual < questoes.length) {
                carregarQuestao();
            } else {
                finalizarQuiz();
            }
        };

        function finalizarQuiz() {
            quizContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            textoResultado.innerHTML = `Parabéns, <b>${nome}</b>!<br>Acertou <b>${pontuacao}</b> de <b>${questoes.length}</b> questões.`;

            // Enviar para o Firebase
            try {
                const resultadoRef = ref(db, 'quiz_tecnico_pedagogico/resultados');
                push(resultadoRef, {
                    nome: nome,
                    email: email,
                    avatar: avatar,
                    pontos: pontuacao,
                    total: questoes.length,
                    data: new Date().toISOString()
                });
            } catch (e) {
                console.error("Erro ao gravar no Firebase:", e);
            }
        }

        carregarQuestao();
    </script>
</body>
</html>
